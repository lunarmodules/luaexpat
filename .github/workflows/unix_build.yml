name: "Unix build"

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        luaVersion: ["5.1", "5.2", "5.3", "5.4", "5.5", "luajit", "luajit-openresty"]
        expatVersion: ["2.4.4", "2.6.2"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: luarocks/gh-actions-lua@85e2287697275df96334743ac654241a8fd34ab3 # v13
      with:
        luaVersion: ${{ matrix.luaVersion }}

    - uses: luarocks/gh-actions-luarocks@95d2308a0aff36ad31ebadca493ed14853399842 # v7
      with:
        luaRocksVersion: "3.13.0"

    - name: dependencies
      run: |
        luarocks install busted

    - name: build expat
      run: |
        git clone -b R_$(echo ${{ matrix.expatVersion }} | sed "s/\./_/g") --single-branch https://github.com/libexpat/libexpat.git
        cd libexpat/expat
        ./buildconf.sh
        ./configure
        sudo make install

    - name: build luaexpat
      run: |
        luarocks make

    - name: test suite
      run: |
        busted --Xoutput "--color"
